# Tool declarations for small local models (B7, v4-local).
# Same names and parameter schemas as artifacts/versions/v3/tools.yaml; only descriptions change.
# Hypothesis: 3B models route by tool descriptions more than by a long prose prompt, so each
# description is short and says USE / DO NOT USE / example.
tools:
- name: clarify
  description: 'Ask the user one question and stop. USE when: the user wants tweets but names no person/account (response_type=text);
    wants a page summarized but gives no URL (text); asks to send/post/publish to Telegram (ALWAYS yes_no first, even if the
    text is given). DO NOT USE for questions you can answer directly, or when the person/URL is already known. Example: {"question":
    "Bạn muốn xem tweet của tài khoản nào?", "response_type": "text"}'
  parameters:
    type: object
    properties:
      question:
        type: string
        default: ''
        description: The question to the user, in the user's language.
      response_type:
        type: string
        enum:
        - text
        - yes_no
        - choice
        default: text
        description: yes_no = confirm a send/post; text = ask for a missing account or URL; choice = pick from options.
      options:
        type: array
        default: []
        items:
          type: string
        description: Only for response_type=choice.
    required:
    - question
    - response_type
- name: timeline
  description: 'Get recent posts BY one known X/Twitter account. USE when the user names the person or handle: Sam Altman=sama,
    Elon Musk=elonmusk, Andrej Karpathy=karpathy. DO NOT USE when no person is named (use clarify) or for posts ABOUT a topic
    (use social_search). Never invent a handle. Example: {"screenname": "elonmusk", "limit": 10}'
  parameters:
    type: object
    properties:
      screenname:
        type: string
        description: Handle without @, e.g. sama. Use the latest person the user asked for.
      limit:
        type: integer
        default: 5
        description: Number of posts the user asked for, as an integer; keep the user's latest correction.
    required:
    - screenname
- name: social_search
  description: 'Search X/Twitter posts ABOUT a topic. USE when the user asks what people say on Twitter/X about something.
    DO NOT USE for one person''s own posts (timeline) or for web news (lookup). Example: {"query": "GPT-5", "search_type":
    "Top", "limit": 5}'
  parameters:
    type: object
    properties:
      query:
        type: string
        description: Topic only, e.g. OpenAI.
        minLength: 1
      search_type:
        type: string
        enum:
        - Latest
        - Top
        default: Latest
        description: Top = popular/nổi bật; Latest = newest.
      limit:
        type: integer
        default: 5
        description: Number of posts, as an integer.
    required:
    - query
- name: lookup
  description: 'Web search for news and information. USE for web news (topic=news). DO NOT USE when the user gives a URL (use
    fetch), for Twitter/X posts (social_search/timeline), or for math/coding requests (no tool). Example: {"query": "AI",
    "topic": "news", "timeframe": "day"}'
  parameters:
    type: object
    properties:
      query:
        type: string
        default: ''
        description: Subject only, e.g. AI or robotics; no words like news/today/tin tức.
      topic:
        type: string
        enum:
        - general
        - news
        default: general
        description: news for any news/tin tức request.
      timeframe:
        type: string
        enum:
        - day
        - week
        - month
        - year
        default: week
        description: today/hôm nay=day, this week/tuần này=week, month, year.
      max_results:
        type: integer
        default: 5
        description: Number of results, as an integer.
    required:
    - query
- name: fetch
  description: 'Read one web page from a URL the user gave (http:// or https://). USE whenever the message contains a URL
    to read or summarize. DO NOT USE without a URL (ask with clarify) and never make up a URL. Example: {"url": "https://example.com/post"}'
  parameters:
    type: object
    properties:
      url:
        type: string
        default: ''
        description: The exact URL from the conversation.
    required:
    - url
- name: format
  description: Turn items you already retrieved into a digest. USE only after a search returned items and the user wants a
    digest. DO NOT USE to search or to answer questions.
  parameters:
    type: object
    properties:
      items:
        type: array
        default: []
        description: Items from earlier tool results.
        items:
          type: object
          properties:
            title:
              type: string
            url:
              type: string
            source:
              type: string
            summary:
              type: string
            section:
              type: string
      template:
        type: string
        enum:
        - brief
        - sections
        - bullets
        - thread
        - daily_ai_vn
        default: sections
        description: Layout of the digest.
      headline:
        type: string
        default: ''
        description: Optional title.
    required:
    - items
    - template
- name: send
  description: Post a message to the team Telegram channel. USE only after the user answered yes to a clarify(yes_no) question
    that quoted the exact text; then confirmed=true. DO NOT USE on the first request to send/post (ask clarify yes_no first)
    or to show a normal answer.
  parameters:
    type: object
    properties:
      text:
        type: string
        default: ''
        description: The exact approved text.
      confirmed:
        type: boolean
        default: false
        description: true only after the user said yes.
    required:
    - text
- name: policy
  description: Search the company's internal policy documents. USE for questions about company rules (publishing, citation,
    privacy, tool usage, AI research). DO NOT USE for math, coding or general questions.
  parameters:
    type: object
    properties:
      query:
        type: string
        default: ''
        description: What the user asks about.
      policy_area:
        type: string
        enum:
        - all
        - ai_research
        - source_citation
        - data_privacy
        - external_publishing
        - tool_usage
        default: all
        description: Pick one of the listed areas; all if unsure.
      top_k:
        type: integer
        default: 3
        description: Number of results, as an integer.
    required:
    - query
- name: papers
  description: 'Find scientific papers on arXiv. USE when the user asks for papers/research articles on a topic. DO NOT USE
    for news. Example: {"query": "AI agent evaluation", "sort_by": "submittedDate"}'
  parameters:
    type: object
    properties:
      query:
        type: string
        default: ''
        description: Paper topic.
      max_results:
        type: integer
        default: 5
        description: Number of papers, as an integer.
      sort_by:
        type: string
        enum:
        - relevance
        - lastUpdatedDate
        - submittedDate
        default: relevance
        description: submittedDate for new/recent papers.
    required:
    - query
- name: paper_text
  description: Read the text of one known arXiv paper. USE when the user gives an arXiv ID or arXiv URL. DO NOT USE to search
    for papers (papers).
  parameters:
    type: object
    properties:
      arxiv_url:
        type: string
        default: ''
        description: arXiv ID or URL, e.g. 2401.12345.
      max_pages:
        type: integer
        default: 5
        description: Pages to read, as an integer.
      max_chars:
        type: integer
        default: 8000
        description: Max characters, as an integer.
    required:
    - arxiv_url
- name: deduplicate
  description: Remove items with the same URL from a list you already have. USE only when the user asks to remove duplicates
    from given/retrieved items. DO NOT USE to search, or for coding/math.
  parameters:
    type: object
    properties:
      items:
        type: array
        description: Existing items; items without a URL are kept.
        items:
          type: object
          properties:
            title:
              type: string
            url:
              type: string
            summary:
              type: string
            source:
              type: string
    required:
    - items
- name: get_yahoo_finance_data
  description: 'Latest quote for one Yahoo Finance ticker. USE when the user asks the price of a ticker like NVDA or GC=F.
    DO NOT USE for news; ask with clarify if the ticker is unclear. Example: {"ticker": "NVDA"}'
  parameters:
    type: object
    properties:
      ticker:
        type: string
        description: One Yahoo Finance symbol, e.g. NVDA, GC=F, BTC-USD; not a URL.
    required:
    - ticker
- name: date
  description: 'Today''s date and weekday in Vietnam time. USE when the user asks what day/date it is, or for yesterday/tomorrow/last
    week/next week. DO NOT USE just because a news request says today or this week (lookup has timeframe). Example: {"offset_days":
    -1}'
  parameters:
    type: object
    properties:
      offset_days:
        type: integer
        default: 0
        description: 'Days from today as an integer: yesterday=-1, tomorrow=1, two weeks ago=-14.'
    required: []
